# Deploys the `feat/importer-ledger-receipts` branch to its OWN MonsterASP
# site — a THIRD hosting account, separate from both master → site61833 and
# `customize-solution-for-other` → the FTP_*_OTHER site.
#
# This file exists ONLY on the importer branch. deploy.yml (master only) and
# deploy-other.yml (customize-solution-for-other only) are both inert here,
# so exactly one pipeline fires per push and merges in either direction stay
# conflict-free.
#
# Required repository secrets (set these BEFORE the first push — without them
# the FTP steps fail with an empty server host):
#   FTP_SERVER_IMPORTER     e.g. siteNNNNN.siteasp.net
#   FTP_USERNAME_IMPORTER   the new account's FTP user
#   FTP_PASSWORD_IMPORTER   the new account's FTP password
#
# Pipeline logic below is byte-identical to deploy-other.yml — same site shape
# (landing page at "/", ERP app under "/admin/"), same change detection, same
# excludes. Only the trigger branch and the three FTP secrets differ.
#
# Like the other two sites, appsettings.Production.json (DB connection string
# + JWT key) is maintained directly on the host and excluded from every sync.
name: Deploy to MonsterASP.NET (Importer)

on:
  push:
    branches: [feat/importer-ledger-receipts]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      # Full history so the push's base commit is always available to diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Deterministic change detection over the EXACT push range
      # (github.event.before .. github.sha). Replaces dorny/paths-filter, whose
      # push-event base heuristic intermittently fell back to "everything
      # changed" and forced a full deploy for frontend-only pushes (e.g. a
      # commit of only frontend files + README ran the full .NET pipeline).
      - name: Detect changed areas
        id: detect
        run: |
          BASE="${{ github.event.before }}"
          # New branch / missing or unknown base → can't diff safely, so fall
          # back to a FULL deploy (never risk skipping a real backend change).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit ('$BASE') — forcing full deploy."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "Changed files in ${BASE}..${{ github.sha }}:"
          echo "$CHANGED"
          FRONTEND=false
          BACKEND=false
          # Frontend = the React app or the landing page.
          if printf '%s\n' "$CHANGED" | grep -qE '^(myapp-frontend/|landing/)'; then FRONTEND=true; fi
          # Backend = .NET sources/project, server config, or the CI workflows
          # themselves (a pipeline change always warrants a full run).
          if printf '%s\n' "$CHANGED" | grep -qE '(\.cs|\.csproj)$|(^|/)appsettings[^/]*\.json$|(^|/)web\.config$|^\.github/workflows/'; then BACKEND=true; fi
          echo "Decision: frontend=$FRONTEND backend=$BACKEND"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND"  >> "$GITHUB_OUTPUT"

  # Fast path: only frontend changed — no .NET build, no app restart
  deploy-frontend-only:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' && needs.detect-changes.outputs.backend == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        working-directory: myapp-frontend
        env:
          VITE_BASE_PATH: /admin/
        run: |
          npm ci
          npm run build

      # Site shape: landing page at "/", ERP app under "/admin/".
      # Product showcase images belong to MASTER's in-app landing page —
      # unused on this site (its /admin root redirects to login), so they
      # are stripped from the artifact to keep deploys small.
      - name: Stage site root (landing at /, app under /admin)
        run: |
          mkdir -p site-stage/admin
          cp landing/index.html site-stage/index.html
          cp -r myapp-frontend/dist/* site-stage/admin/
          rm -rf site-stage/admin/images/products

      - name: Deploy frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_IMPORTER }}
          username: ${{ secrets.FTP_USERNAME_IMPORTER }}
          password: ${{ secrets.FTP_PASSWORD_IMPORTER }}
          local-dir: ./site-stage/
          server-dir: /wwwroot/wwwroot/
          state-name: .frontend-deploy-sync-state.json
          dangerous-clean-slate: false

  # Full path: backend changed — build everything, restart app
  # FTP sync only uploads changed files automatically
  deploy-full:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React Frontend
        working-directory: myapp-frontend
        env:
          VITE_BASE_PATH: /admin/
        run: |
          npm ci
          npm run build

      # Rebuild wwwroot from scratch so stale repo-tracked layouts never
      # leak into the artifact: landing page at "/", ERP app under "/admin/".
      # Product images are master-landing-only — stripped here too.
      - name: Stage wwwroot (landing at /, app under /admin)
        run: |
          rm -rf wwwroot
          mkdir -p wwwroot/admin
          cp landing/index.html wwwroot/index.html
          cp -r myapp-frontend/dist/* wwwroot/admin/
          rm -rf wwwroot/admin/images/products

      - name: Publish .NET API
        run: dotnet publish MyApp.Api.csproj -c Release -o ./publish

      - name: Copy frontend wwwroot into publish
        run: |
          mkdir -p ./publish/wwwroot
          cp -r wwwroot/* ./publish/wwwroot/

      - name: Stop app (upload app_offline.htm)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_IMPORTER }}
          username: ${{ secrets.FTP_USERNAME_IMPORTER }}
          password: ${{ secrets.FTP_PASSWORD_IMPORTER }}
          local-dir: ./.github/offline/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      - name: Wait for app to stop
        run: sleep 5

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_IMPORTER }}
          username: ${{ secrets.FTP_USERNAME_IMPORTER }}
          password: ${{ secrets.FTP_PASSWORD_IMPORTER }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          # dangerous-clean-slate=false → the action never deletes remote
          # files that aren't in the local upload. Combined with the
          # excludes below, this means the server's appsettings.Production.json
          # (maintained manually on the host) is never overwritten and never
          # deleted by a deploy.
          dangerous-clean-slate: false
          exclude: |
            **/.pdb
            **/runtimes/linux-*/**
            **/runtimes/osx-*/**
            # Environment-specific config — managed directly on the server.
            # appsettings.Production.json carries the real DB connection
            # string and JWT signing key; appsettings.Development.json is
            # local-only. Never let either travel through this pipeline.
            **/appsettings.Development.json
            **/appsettings.Production.json
            # .example templates are dev-side documentation — no business
            # being on the prod server.
            **/appsettings.*.example.json
