<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon set. Vite rewrites these leading slashes with the deploy base, so
         under /admin/ they resolve to /admin/favicon.* -- verified in the built
         output, not assumed. The .ico matters because a browser falls back to
         requesting one when it cannot use the declared icon, and this site
         answered that request with a 404, which is what left the tab blank.
         Declared smallest-first; the browser takes the last one it supports. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <!-- Icon sources are RELATIVE inside the manifest, so they resolve
         against the manifest's own URL and survive the /admin/ base. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d47a1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hakimi Traders — Karachi-based specialist supplier of pneumatic, hydraulic and industrial equipment. Genuine components from 20+ global brands since 2009."
    />
    <title>FBR Digital Invoicing ERP</title>

    <!-- Typography: Space Grotesk (display) / Inter (body) / IBM Plex Mono (labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- runtime config (must load before main.jsx) -->
    <script src="/runtime-env.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
